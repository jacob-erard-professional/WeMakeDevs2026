[project]
name = "wemakedevs-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "elasticsearch>=8.15,<10",
  "python-multipart>=0.0.18", "qrcode[pil]>=8,<9", "pydantic-settings>=2.6,<3",
  "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
