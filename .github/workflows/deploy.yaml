# After a merge to main: build the frontend and backend images, push them to GHCR, and publish
# main's deploy/ with both images pinned to the `deploy` branch. Argo CD in cluster wearedevs
# watches `deploy`, so main stays PR-only and the bot never pushes to it.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - .github/workflows/deploy.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # Manual runs too: only main (reviewed code) may reach the cluster.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Image names and tag
        id: meta
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish manifests to the deploy branch
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          WEB_IMAGE: ${{ steps.meta.outputs.web }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(WEB_IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
          yq -i '(.images[] | select(.name == "backend")) |= (.newName = strenv(BACKEND_IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
          git checkout -B deploy
          git commit -qam "deploy: ${TAG}"
          # The deploy branch is derived from main on every run; runs are serialized above.
          git push -f origin deploy
