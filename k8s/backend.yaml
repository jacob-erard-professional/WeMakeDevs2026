apiVersion: v1
kind: ConfigMap
metadata:
  name: wemakedevs2026-backend
data:
  ES_URL: http://elasticsearch:9200
  PUBLIC_BASE_URL: http://localhost:8081
  SCHEDULE_DRAFT_TTL_HOURS: "24"
  SCHEDULE_MAX_UPLOAD_BYTES: "20971520"
  OPENROUTER_MODEL: openai/gpt-4o-mini
  OPENROUTER_SITE_URL: http://localhost:8081
  OPENROUTER_APP_NAME: WeMakeDevs2026
  OTEL_SERVICE_NAME: wemakedevs2026-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wemakedevs2026-backend
  labels:
    app: wemakedevs2026-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wemakedevs2026-backend
  template:
    metadata:
      labels:
        app: wemakedevs2026-backend
    spec:
      containers:
        - name: api
          image: wemakedevs2026-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: wemakedevs2026-backend
            - secretRef:
                name: wemakedevs2026-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: wemakedevs2026-backend
spec:
  type: NodePort
  selector:
    app: wemakedevs2026-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
