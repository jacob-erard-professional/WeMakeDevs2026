# kind cluster for local development: `scripts/dev-up.sh` creates it.
# Expose the app as a NodePort on 30080 and it is reachable at http://localhost:8081.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wemakedevs2026
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
