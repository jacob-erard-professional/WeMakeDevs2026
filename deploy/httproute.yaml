# Inert inside the vcluster (it has no Gateway); the platform does the routing.
# Kept because the starter ships it and Argo CD counts it healthy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: cnh
      namespace: gateway
      sectionName: https
  hostnames:
    - wearedevs.cnh.radarhq.io
  rules:
    - backendRefs:
        - name: app
          port: 80
