# The platform routes https://wearedevs.cnh.radarhq.io to Service app, port 80. Keep both.
# app is the frontend (nginx); it serves the web build and proxies /api/* to Service backend.
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: http
